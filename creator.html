<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Center App AI - Native APK Builder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    header h1 { font-size: 1.4rem; color: #38bdf8; }
    header a { color: #94a3b8; text-decoration: none; border: 1px solid #334155; padding: 6px 14px; border-radius: 6px; font-size: 0.9rem; }
    .container { background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 800px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    label { font-size: 0.95rem; color: #e2e8f0; display: block; margin-bottom: 8px; font-weight: bold; }
    input[type="text"], textarea { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: white; font-size: 0.95rem; outline: none; margin-bottom: 15px; }
    textarea { height: 100px; resize: none; }
    .btn-build { width: 100%; background: #0284c7; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn-build:hover { background: #0369a1; }
    .btn-build:disabled { background: #475569; cursor: not-allowed; }
    #outputArea { margin-top: 25px; display: none; flex-direction: column; gap: 15px; }
    iframe { width: 100%; height: 350px; background: white; border: 2px solid #334155; border-radius: 10px; }
    .btn-apk-download { background: #22c55e; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; }
    .btn-apk-download:hover { background: #16a34a; }
    .instructions { background: #0f172a; padding: 12px; border-radius: 8px; font-size: 0.85rem; color: #94a3b8; line-height: 1.5; border-left: 3px solid #38bdf8; }
  </style>
</head>
<body>

  <header>
    <h1>🛠️ Center App APK Generator</h1>
    <a href="index.html">💬 Koma Chat</a>
  </header>

  <div class="container">
    <label for="appNameInput">Sunan App dinka da za ya fito a Fuskar Waya:</label>
    <input type="text" id="appNameInput" placeholder="Misali: My Expense Tracker" value="My App">

    <label for="promptInput">Bada bayanin kowane irin App dake kike son gina:</label>
    <textarea id="promptInput" placeholder="Misali: Gina min cikakken App na kula da harkokin kudi..."></textarea>
    
    <button class="btn-build" id="buildBtn" onclick="generateApp()">🏗️ Kirkiro App Yanzu</button>

    <div id="outputArea">
      <div style="color:#38bdf8; font-weight:bold;">📱 Gwada App Din Ka (Live Preview):</div>
      <iframe id="appFrame"></iframe>
      
      <div class="instructions">
        📌 <strong>Hanyar Samun Ainihin APK File:</strong> Danna maballin green na kasa don sauke fayil din HTML, sannan gidan converter za ya bude don baka ainihin fayil din <strong>.APK</strong> daka iya turawa kowa a WhatsApp ko sakawa a cikin App Menu dinka.
      </div>

      <button class="btn-apk-download" onclick="downloadAppAndConvert()">📲 Sauke Fayil Din & Maida Shi APK</button>
    </div>
  </div>

<script>
let compiledCode = "";
let currentAppName = "My_App";

async function generateApp() {
  const prompt = document.getElementById('promptInput').value.trim();
  const appName = document.getElementById('appNameInput').value.trim() || "My App";
  currentAppName = appName;
  
  const buildBtn = document.getElementById('buildBtn');
  const outputArea = document.getElementById('outputArea');
  const frame = document.getElementById('appFrame');

  if (!prompt) {
    alert("Dan Allah rubuta bayanin app din da kake son gina!");
    return;
  }

  buildBtn.disabled = true;
  buildBtn.textContent = "⏳ AI Yana gina App din...";
  outputArea.style.display = "none";

  const systemInstruction = `You are a professional web app creator. Generate a SINGLE complete HTML file with embedded CSS and JS. DO NOT use markdown codeblock tags.`;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `${systemInstruction}\nApp Request: ${prompt}` })
    });

    const data = await res.json();

    if (res.ok && data.reply) {
      compiledCode = data.reply.replace(/^```html\s*/i, '').replace(/^```\s*/i, '').replace(/```$/g, '').trim();
      frame.srcdoc = compiledCode;
      outputArea.style.display = "flex";
    } else {
      alert("❌ " + (data.error || "An samu kuskure."));
    }
  } catch (err) {
    alert("❌ Kuskure wajen haɗawa da Server.");
  } finally {
    buildBtn.disabled = false;
    buildBtn.textContent = "🏗️ Kirkiro App Yanzu";
  }
}

function downloadAppAndConvert() {
  if (!compiledCode) return;

  // 1. Sauke Fayil din HTML
  const blob = new Blob([compiledCode], { type: "text/html;charset=utf-8" });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `${currentAppName.replace(/\s+/g, '_')}.html`;
  link.click();

  // 2. Buɗe WebIntoApp Converter
  setTimeout(() => {
    window.open('[https://www.webintoapp.com](https://www.webintoapp.com)', '_blank');
  }, 800);
}
</script>

</body>
</html>
