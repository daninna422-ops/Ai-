<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Center App AI - Professional Creator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    header h1 { font-size: 1.4rem; color: #38bdf8; }
    header a { color: #94a3b8; text-decoration: none; border: 1px solid #334155; padding: 6px 14px; border-radius: 6px; font-size: 0.9rem; }
    .container { background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 800px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    label { font-size: 1rem; color: #e2e8f0; display: block; margin-bottom: 8px; font-weight: bold; }
    textarea { width: 100%; height: 110px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: white; font-size: 1rem; outline: none; margin-bottom: 15px; resize: none; }
    textarea:focus { border-color: #38bdf8; }
    .btn-build { width: 100%; background: #0284c7; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn-build:hover { background: #0369a1; }
    .btn-build:disabled { background: #475569; cursor: not-allowed; }
    #outputArea { margin-top: 25px; display: none; flex-direction: column; gap: 15px; }
    .preview-title { font-size: 1.1rem; color: #38bdf8; font-weight: bold; }
    iframe { width: 100%; height: 380px; background: white; border: 2px solid #334155; border-radius: 10px; }
    .btn-download { background: #22c55e; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; }
  </style>
</head>
<body>

  <header>
    <h1>🛠️ App Creator AI (Pro)</h1>
    <a href="index.html">💬 Koma Chat</a>
  </header>

  <div class="container">
    <label for="promptInput">Bada cikakken bayanin App din da kake son gina:</label>
    <textarea id="promptInput" placeholder="Misali: Gina min cikakken App na kula da harkokin kudi (Expense Tracker) mai zane-zane na kwarai..."></textarea>
    
    <button class="btn-build" id="buildBtn" onclick="generateApp()">🏗️ Kirkiro Cikakken App (Multi-File)</button>

    <div id="outputArea">
      <div class="preview-title">📱 Gwada App Din Ka (Live Preview):</div>
      <iframe id="appFrame"></iframe>
      
      <button class="btn-download" onclick="downloadZipApp()">📦 Sauke Cikakken App (ZIP Package)</button>
    </div>
  </div>

<script>
let generatedData = null;

async function generateApp() {
  const prompt = document.getElementById('promptInput').value.trim();
  const buildBtn = document.getElementById('buildBtn');
  const outputArea = document.getElementById('outputArea');
  const frame = document.getElementById('appFrame');

  if (!prompt) {
    alert("Dan Allah rubuta bayanin app din da kake son gina!");
    return;
  }

  buildBtn.disabled = true;
  buildBtn.textContent = "⏳ AI Yana gina fayilolin App dinka (HTML, CSS, JS)...";
  outputArea.style.display = "none";

  const systemInstruction = `You are an expert full-stack web app developer. 
Return ONLY a JSON object containing three properties: "html", "css", and "javascript".
Do NOT use Markdown formatting like json or html in your output. Return raw valid JSON string only.
Structure:
{
  "html": "<!DOCTYPE html>...",
  "css": "/* styles */",
  "javascript": "// logic"
}`;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `${systemInstruction}\nUser App Request: ${prompt}` })
    });

    const data = await res.json();

    if (res.ok && data.reply) {
      let cleanText = data.reply.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/```$/g, '').trim();
      generatedData = JSON.parse(cleanText);

      // Haɗa su don Live Preview kawai
      const fullContent = `
        <!DOCTYPE html>
        <html>
        <head>
          <style>${generatedData.css || ''}</style>
        </head>
        <body>
          ${generatedData.html || ''}
          <script>${generatedData.javascript || ''}<\/script>
        </body>
        </html>
      `;

      frame.srcdoc = fullContent;
      outputArea.style.display = "flex";
    } else {
      alert("❌ " + (data.error || "An samu kuskure wajen gina App."));
    }
  } catch (err) {
    alert("❌ Kuskure wajen sarrafa bayanai ko haɗawa da Server. Da sauran kuskuren JSON parsing.");
  } finally {
    buildBtn.disabled = false;
    buildBtn.textContent = "🏗️ Kirkiro Cikakken App (Multi-File)";
  }
}

function downloadZipApp() {
  if (!generatedData) return;
  
  const zip = new JSZip();
  zip.file("index.html", `<!DOCTYPE html>\n<html lang="ha">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<link rel="stylesheet" href="style.css">\n</head>\n<body>\n${generatedData.html}\n<script src="script.js"><\/script>\n</body>\n</html>`);
  zip.file("style.css", generatedData.css || "");
  zip.file("script.js", generatedData.javascript || "");

  zip.generateAsync({type:"blob"}).then(function(content) {
    const link = document.createElement('a');
    link.href = URL.createObjectURL(content);
    link.download = "CenterApp_Project.zip";
    link.click();
  });
}
</script>

</body>
</html>
