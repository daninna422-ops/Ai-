<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Center App AI - Step Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    iframe { width: 100%; height: 400px; background: #fff; border-radius: 8px; }
  </style>
</head>
<body class="p-4 md:p-8 max-w-4xl mx-auto">

  <header class="flex justify-between items-center mb-6">
    <h1 class="text-xl font-bold text-sky-400"><i class="fa-solid fa-cubes"></i> Multi-Step App Builder</h1>
    <a href="index.html" class="text-xs bg-slate-800 border border-slate-700 px-3 py-2 rounded text-slate-300">💬 Chat</a>
  </header>

  <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl space-y-4">
    <div>
      <label class="block font-bold mb-1 text-sm">Sunan App:</label>
      <input type="text" id="appName" class="w-full bg-slate-900 border border-slate-700 p-3 rounded text-white" value="My App">
    </div>

    <div>
      <label class="block font-bold mb-1 text-sm">Cikakken Bayanin App din da kake so:</label>
      <textarea id="appPrompt" class="w-full bg-slate-900 border border-slate-700 p-3 rounded text-white h-24" placeholder="Misali: App na harkar kudi da dashboard..."></textarea>
    </div>

    <!-- Stepper Progress Controls -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
      <button id="step1Btn" onclick="buildStep(1)" class="bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 rounded text-sm flex items-center justify-center gap-2">
        <span>1️⃣ Mataki 1: Gina Fuska (UI)</span>
      </button>
      
      <button id="step2Btn" onclick="buildStep(2)" disabled class="bg-slate-700 text-slate-400 font-bold py-3 rounded text-sm cursor-not-allowed flex items-center justify-center gap-2">
        <span>2️⃣ Mataki 2: Cika Ayyuka (Logic)</span>
      </button>
    </div>

    <div id="statusBox" class="hidden text-xs text-amber-400 font-semibold text-center p-2 bg-slate-900 rounded"></div>

    <!-- Output Section -->
    <div id="outputArea" class="hidden flex-col gap-4 pt-4 border-t border-slate-700">
      <div class="text-sky-400 font-bold text-sm">📱 Live Preview:</div>
      <iframe id="appFrame"></iframe>

      <div class="flex flex-col sm:flex-row gap-3">
        <button onclick="downloadCode()" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded text-sm text-center">
          📥 Sauke Cikakken HTML
        </button>
        <a href="https://www.webintoapp.com" target="_blank" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded text-sm text-center">
          📲 Maida Shi APK (WebIntoApp)
        </a>
      </div>
    </div>
  </div>

<script>
let appState = {
  name: '',
  prompt: '',
  uiCode: '',
  finalCode: ''
};

async function buildStep(step) {
  const name = document.getElementById('appName').value.trim() || "My App";
  const prompt = document.getElementById('appPrompt').value.trim();
  const statusBox = document.getElementById('statusBox');
  const step1Btn = document.getElementById('step1Btn');
  const step2Btn = document.getElementById('step2Btn');
  const outputArea = document.getElementById('outputArea');
  const frame = document.getElementById('appFrame');

  if (!prompt) {
    alert("Da alama baka rubuta bayanin App din ba!");
    return;
  }

  appState.name = name;
  appState.prompt = prompt;

  statusBox.classList.remove('hidden');
  
  if (step === 1) {
    statusBox.innerText = "⏳ Mataki 1: AI Yana zana fuskatar App (UI & Styles)...";
    step1Btn.disabled = true;

    const sysMsg = `You are an expert web UI designer. Build only the HTML and Tailwind CSS UI skeleton for this app: "${prompt}". Use Tailwind CDN in head. DO NOT include markdown tags like \`\`\`html. Return pure raw HTML.`;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: sysMsg })
      });
      const data = await res.json();
      
      if (data.reply) {
        appState.uiCode = cleanCode(data.reply);
        frame.srcdoc = appState.uiCode;
        outputArea.classList.remove('hidden');
        outputArea.classList.add('flex');
        
        statusBox.innerText = "✅ An kammala Mataki 1! Yanzu danna Mataki 2 domin sa aiki a ciki.";
        step2Btn.disabled = false;
        step2Btn.classList.remove('bg-slate-700', 'text-slate-400', 'cursor-not-allowed');
        step2Btn.classList.add('bg-indigo-600', 'hover:bg-indigo-700', 'text-white');
      }
    } catch (e) {
      statusBox.innerText = "❌ An samu kuskure wajen gina Mataki 1.";
    } finally {
      step1Btn.disabled = false;
    }
  } 
  
  else if (step === 2) {
    statusBox.innerText = "⏳ Mataki 2: AI Yana haɗa JavaScript & Logics na gaske...";
    step2Btn.disabled = true;

    const sysMsg = `Take this HTML layout:\n${appState.uiCode}\n\nAdd complete functional JavaScript logic, event handlers, interactive elements, and data storage for the request: "${prompt}". DO NOT return markdown like \`\`\`html. Return ONLY the complete executable single HTML file code.`;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: sysMsg })
      });
      const data = await res.json();

      if (data.reply) {
        appState.finalCode = cleanCode(data.reply);
        frame.srcdoc = appState.finalCode;
        statusBox.innerText = "🎉 Cikakken App ya kammala 100%! Ka iya saukewa ko maida shi APK.";
      }
    } catch (e) {
      statusBox.innerText = "❌ An samu kuskure wajen haɗa Mataki 2.";
    } finally {
      step2Btn.disabled = false;
    }
  }
}

function cleanCode(str) {
  return str.replace(/^```html\s*/i, '').replace(/^```\s*/i, '').replace(/```$/g, '').trim();
}

function downloadCode() {
  const content = appState.finalCode || appState.uiCode;
  if (!content) return;
  const blob = new Blob([content], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${appState.name.replace(/\s+/g, '_')}.html`;
  a.click();
}
</script>
</body>
</html>
