<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Center App AI - Creator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    header { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    header h1 { font-size: 1.4rem; color: #38bdf8; }
    header a { color: #94a3b8; text-decoration: none; border: 1px solid #334155; padding: 6px 14px; border-radius: 6px; font-size: 0.9rem; }

    .container { background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 800px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    
    label { font-size: 1rem; color: #e2e8f0; display: block; margin-bottom: 8px; font-weight: bold; }
    textarea { width: 100%; height: 110px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px; color: white; font-size: 1rem; outline: none; margin-bottom: 15px; resize: none; }
    textarea:focus { border-color: #38bdf8; }

    .btn-build { width: 100%; background: #0284c7; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
    .btn-build:hover { background: #0369a1; }
    .btn-build:disabled { background: #475569; cursor: not-allowed; }

    #outputArea { margin-top: 25px; display: none; flex-direction: column; gap: 15px; }
    .preview-title { font-size: 1.1rem; color: #38bdf8; font-weight: bold; }

    iframe { width: 100%; height: 400px; background: white; border: 2px solid #334155; border-radius: 10px; }

    .btn-download { background: #22c55e; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; transition: 0.3s; display: block; }
    .btn-download:hover { background: #16a34a; }
  </style>
</head>
<body>

  <header>
    <h1>🛠️ App Creator AI</h1>
    <a href="index.html">💬 Koma Chat</a>
  </header>

  <div class="container">
    <label for="promptInput">Bada bayanin kowane irin App dake kike son gina:</label>
    <textarea id="promptInput" placeholder="Misali: Gina min App na lissafin kudi, ko App na takaitaccen bayanin gidan abinci..."></textarea>
    
    <button class="btn-build" id="buildBtn" onclick="generateApp()">🏗️ Kirkiro App Yanzu</button>

    <div id="outputArea">
      <div class="preview-title">📱 Gwada App Din Ka (Live Preview):</div>
      <iframe id="appFrame"></iframe>
      
      <button class="btn-download" onclick="downloadGeneratedApp()">📥 Sauke App Din A Waya (HTML App)</button>
    </div>
  </div>

<script>
let fullHtmlCode = "";

async function generateApp() {
  const prompt = document.getElementById('promptInput').value.trim();
  const buildBtn = document.getElementById('buildBtn');
  const outputArea = document.getElementById('outputArea');
  const frame = document.getElementById('appFrame');

  if (!prompt) {
    alert("Dan Allah rubuta bayanin app din da kake son gina!");
    return;
  }

  buildBtn.disabled = true;
  buildBtn.textContent = "⏳ AI Yana gina App dinka, jira kadan...";
  outputArea.style.display = "none";

  const systemInstruction = "You are an expert web application generator. Generate ONLY valid, standalone single-file HTML code with embedded CSS and JavaScript based on the user request. DO NOT add Markdown formatting like ```html, write ONLY pure HTML starting with <!DOCTYPE html>.";

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `${systemInstruction}\nUser request: ${prompt}` })
    });

    const data = await res.json();

    if (res.ok && data.reply) {
      // Tsallake duk wani code block tag na Markdown idan ya fito
      fullHtmlCode = data.reply.replace(/^```html\s*/i, '').replace(/^```\s*/i, '').replace(/```$/g, '').trim();

      // Nuna App din a cikin iframe
      frame.srcdoc = fullHtmlCode;
      outputArea.style.display = "flex";
    } else {
      alert("❌ " + (data.error || "An samu kuskure wajen gina App."));
    }
  } catch (err) {
    alert("❌ Kuskure wajen haɗawa da Server.");
  } finally {
    buildBtn.disabled = false;
    buildBtn.textContent = "🏗️ Kirkiro App Yanzu";
  }
}

function downloadGeneratedApp() {
  if (!fullHtmlCode) return;
  const blob = new Blob([fullHtmlCode], { type: "text/html;charset=utf-8" });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = "CenterApp_Generated.html";
  link.click();
}
</script>

</body>
</html>
