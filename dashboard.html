<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Center Bank - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b1329; color: #f8fafc; }
    .card-gradient { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
    .glass-box { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="p-4 max-w-lg mx-auto pb-24">

  <!-- Header Section -->
  <div class="flex justify-between items-center my-4">
    <div>
      <p class="text-xs text-slate-400">Barka da zuwa,</p>
      <h2 id="userName" class="text-xl font-bold text-white">Loading...</h2>
    </div>
    <button onclick="logout()" class="bg-red-500/20 text-red-400 text-xs px-3 py-2 rounded-xl border border-red-500/30">Fita (Logout)</button>
  </div>

  <!-- ATM / Balance Card -->
  <div class="card-gradient rounded-3xl p-6 text-white shadow-xl mb-6 relative overflow-hidden">
    <div class="flex justify-between items-center mb-4">
      <span class="text-xs opacity-80 uppercase tracking-widest">Main Account</span>
      <span id="accountNumber" class="font-mono text-sm tracking-wider opacity-90">312-------</span>
    </div>
    <p class="text-xs opacity-75">Sauran Kuɗi (Balance)</p>
    <div class="flex items-center gap-2 mt-1">
      <h1 id="userBalance" class="text-3xl font-extrabold tracking-tight">₦0.00</h1>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="grid grid-cols-3 gap-3 mb-6">
    <button onclick="openTransferModal()" class="glass-box p-4 rounded-2xl flex flex-col items-center justify-center gap-2 hover:bg-slate-800 transition">
      <div class="w-10 h-10 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center">💸</div>
      <span class="text-xs font-semibold">Tura Kuɗi</span>
    </button>
    <button onclick="alert('Feature na zuwa hanzari!')" class="glass-box p-4 rounded-2xl flex flex-col items-center justify-center gap-2 hover:bg-slate-800 transition">
      <div class="w-10 h-10 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center">📲</div>
      <span class="text-xs font-semibold">Siyan Katiki</span>
    </button>
    <button onclick="alert('Feature na zuwa hanzari!')" class="glass-box p-4 rounded-2xl flex flex-col items-center justify-center gap-2 hover:bg-slate-800 transition">
      <div class="w-10 h-10 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center">💡</div>
      <span class="text-xs font-semibold">Bayanai</span>
    </button>
  </div>

  <!-- Recent Transactions List -->
  <div class="glass-box rounded-3xl p-5">
    <h3 class="text-sm font-bold text-white mb-4">Bayanin Mu'amala (Transactions)</h3>
    <div id="transactionsList" class="space-y-3 text-xs text-slate-400">
      <p class="text-center py-4">Babu wata mu'amala a yanzu.</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
