<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Center App AI - Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    
    header { background: #1e293b; padding: 15px 20px; text-align: center; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.2rem; color: #38bdf8; }
    header a { color: #94a3b8; text-decoration: none; font-size: 0.9rem; border: 1px solid #334155; padding: 5px 12px; border-radius: 6px; }

    .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    
    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
    .user { background: #0284c7; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .bot { background: #1e293b; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }

    .input-area { background: #1e293b; padding: 15px; border-top: 1px solid #334155; display: flex; gap: 10px; }
    input { flex: 1; background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; color: white; outline: none; font-size: 1rem; }
    input:focus { border-color: #38bdf8; }
    
    button { background: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #475569; }
  </style>
</head>
<body>

  <header>
    <h1>🤖 Center App AI</h1>
    <a href="creator.html">🛠️ App Creator</a>
  </header>

  <div class="chat-container" id="chatBox">
    <div class="message bot">Sannu! 👋 Ni ne Center App AI. Yaya zan iya taimaka maka a yau?</div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Rubuta sakonka anan..." onkeypress="if(event.key==='Enter') sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">Aika</button>
  </div>

<script>
async function sendMessage() {
  const input = document.getElementById('userInput');
  const chatBox = document.getElementById('chatBox');
  const sendBtn = document.getElementById('sendBtn');
  const text = input.value.trim();

  if (!text) return;

  // Sanya sakon mai amfani
  appendMessage('user', text);
  input.value = '';
  sendBtn.disabled = true;

  // Sanya manuniya cewa AI yana tunani
  const loadingDiv = appendMessage('bot', '🤖 Yana tunani...');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();
    
    if (res.ok && data.reply) {
      loadingDiv.textContent = data.reply;
    } else {
      loadingDiv.textContent = "❌ " + (data.error || "An samu matsala wajen amsa sakon.");
    }
  } catch (err) {
    loadingDiv.textContent = "❌ Kuskure wajen haɗawa da Server.";
  } finally {
    sendBtn.disabled = false;
  }
}

function appendMessage(sender, text) {
  const chatBox = document.getElementById('chatBox');
  const msgDiv = document.createElement('div');
  msgDiv.className = `message ${sender}`;
  msgDiv.textContent = text;
  chatBox.appendChild(msgDiv);
  chatBox.scrollTop = chatBox.scrollHeight;
  return msgDiv;
}
</script>

</body>
</html>
